<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reconstitution Demo | One Aminos</title>
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <main id="player" class="player" data-playback="waiting">
    <div class="caption" role="status" aria-atomic="true">
      <span id="step-count"></span>
      <strong id="step-title"></strong>
      <span id="step-detail"></span>
    </div>
    <div class="stage">
      <img class="opening-photo" src="../article-covers/reconstitution.webp" alt="">
      <canvas id="board" aria-hidden="true"></canvas>
      <section class="reference" id="reference" hidden>
        <h2></h2>
        <p id="product"></p>
        <dl>
          <div><dt id="volume-key"></dt><dd id="volume-value"></dd></div>
          <div><dt id="concentration-key"></dt><dd id="concentration-value"></dd></div>
        </dl>
      </section>
    </div>
    <div class="transport">
      <div class="timeline"><input id="progress" type="range" value="0" min="0" max="1" step=".05" aria-label="Playback position"><output id="clock" aria-hidden="true"></output></div>
    <div class="controls">
      <button type="button" id="toggle" disabled>Play</button>
      <label class="speed"><span id="speed-label">Speed</span><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
      <button type="button" id="replay" disabled>Replay</button>
    </div>
    </div>
    <nav id="chapters"><h2 id="chapter-title">Chapters</h2><ol></ol><a id="film-download" href="./reconstitution-en.mp4" download>Download video</a></nav>
  </main>
</body>
</html>
