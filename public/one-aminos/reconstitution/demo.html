<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <base target="_top">
  <title>Reconstitution simulator | One Aminos</title>
  <link rel="stylesheet" href="./css/oneaminos-1.css">
  <link rel="stylesheet" href="./css/oneaminos-2.css">
  <link rel="stylesheet" href="./css/oneaminos-3.css">
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./lx.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body class="lx">
  <main id="simulator-embed">
<section class="sim" data-sim>
<div class="sim-controls">
<div class="sim-field"><div class="picker-heading"><h2 class="sim-field-title">1. Pick your vial</h2>
<div class="picker-paging"><button type="button" id="vials-back" aria-controls="vial-picker" aria-label="Previous vials"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button type="button" id="vials-next" aria-controls="vial-picker" aria-label="Next vials"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>
<div class="sim-vials" id="vial-picker" role="group" aria-label="Peptide"><button type="button" class="sim-vial-pick is-selected" aria-pressed="true" data-h="retatrutide"><img src="/sim-thumbs/glp-3rt-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Retatrutide</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="glp2-tz"><img src="/sim-thumbs/glp2-tz-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Tirzepatide</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="cagrilintide"><img src="/sim-thumbs/cagrilintide-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Cagrilintide</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="5-amino-1mq"><img src="/sim-thumbs/5-amino-1mq-50mg.webp" alt="" width="76" height="144" loading="lazy"><span>5-Amino-1MQ</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="klow"><img src="/sim-thumbs/klow-80mg.webp" alt="" width="76" height="144" loading="lazy"><span>KLOW Blend</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="glow"><img src="/sim-thumbs/glow-70mg.webp" alt="" width="76" height="144" loading="lazy"><span>GLOW Blend</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="bpc157"><img src="/sim-thumbs/bpc157-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>BPC-157</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="tb500"><img src="/sim-thumbs/tb500-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>TB-500</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="kpv"><img src="/sim-thumbs/kpv-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>KPV</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="cartalax"><img src="/sim-thumbs/cartalax-20mg.webp" alt="" width="76" height="144" loading="lazy"><span>Cartalax</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="ara-290"><img src="/sim-thumbs/ara-290-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>ARA-290</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="cjc-ipa"><img src="/sim-thumbs/cjc-ipa-5-5mg.webp" alt="" width="76" height="144" loading="lazy"><span>CJC-1295 / Ipamorelin</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="ipamorelin"><img src="/sim-thumbs/ipamorelin-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Ipamorelin</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="tesamorelin"><img src="/sim-thumbs/tesamorelin-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Tesamorelin</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="igf1lr3"><img src="/sim-thumbs/igf1lr3-1mg.webp" alt="" width="76" height="144" loading="lazy"><span>IGF-1 LR3</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="motsc"><img src="/sim-thumbs/motsc-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>MOTS-c</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="ss31"><img src="/sim-thumbs/ss31-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>SS-31</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="nad-plus"><img src="/sim-thumbs/nad-plus-500mg.webp" alt="" width="76" height="144" loading="lazy"><span>NAD+</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="epithalon"><img src="/sim-thumbs/epithalon-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Epithalon</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="glutathione"><img src="/sim-thumbs/glutathione-1500mg.webp" alt="" width="76" height="144" loading="lazy"><span>Glutathione</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="semax"><img src="/sim-thumbs/semax-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Semax</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="selank"><img src="/sim-thumbs/selank-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Selank</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="dsip"><img src="/sim-thumbs/dsip-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>DSIP</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="adamax"><img src="/sim-thumbs/adamax-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Adamax</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="ghkcu"><img src="/sim-thumbs/ghkcu-50mg.webp" alt="" width="76" height="144" loading="lazy"><span>GHK-Cu</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="mt1"><img src="/sim-thumbs/mt1-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Melanotan 1</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="mt2"><img src="/sim-thumbs/mt2-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Melanotan 2</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="pt141"><img src="/sim-thumbs/pt141-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>PT-141</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="kisspeptin"><img src="/sim-thumbs/kisspeptin-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Kisspeptin-10</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="vip"><img src="/sim-thumbs/vip-5mg.webp" alt="" width="76" height="144" loading="lazy"><span>VIP</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="aod"><img src="/sim-thumbs/aod-5mg.webp" alt="" width="76" height="144" loading="lazy"><span>AOD-9604</span></button><button type="button" class="sim-vial-pick" aria-pressed="false" data-h="eloralintide"><img src="/sim-thumbs/eloralintide-10mg.webp" alt="" width="76" height="144" loading="lazy"><span>Eloralintide</span></button></div></div>
<div class="sim-row">
<div class="sim-field"><h2 class="sim-field-title">2. Vial size</h2><div class="sim-sizes" id="sim-sizes" role="group" aria-label="Vial size"></div></div>
<div class="sim-field"><h2 class="sim-field-title">3. Water to add: <strong id="sim-water-out">2 mL</strong></h2><input class="sim-range" id="sim-water" type="range" min="0.5" max="5" step="0.5" value="2" aria-label="Water to add in mL"><div class="sim-suggest"><button type="button" class="lx-btn lx-btn-outline lx-btn-sm" id="sim-suggest">Use suggested:&nbsp;<span id="sim-suggest-ml"></span></button></div></div>
</div></div>
<div class="sim-stage" aria-label="Animation of the selected vial being mixed" role="img">
<div class="sim-hud"><span>Syringe <strong id="sim-hud-syr">0.00 mL</strong></span><span>Vial <strong id="sim-hud-vial">0.00 mL</strong></span></div>
<div class="sim-vial-box sim-bac"><img src="/sim-vials/bacteriostatic-water-10ml.webp" alt="Bacteriostatic water vial" width="800" height="800"><img class="sim-cap" src="/sim-vials/cap.webp" alt="" width="272" height="81"></div>
<div class="sim-vial-box sim-pep"><img id="sim-pep-img" src="/sim-vials/glp-3rt-10mg.webp" alt="" width="800" height="800"><img class="sim-cap" src="/sim-vials/cap.webp" alt="" width="272" height="81"><div class="sim-shine-wrap"><div class="sim-shine"></div></div></div>
<div class="sim-swab" aria-hidden="true"></div><span class="sim-spark" aria-hidden="true"></span><span class="sim-spark" aria-hidden="true"></span>
<div class="sim-syringe" aria-hidden="true"></div>
<div class="sim-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
<div class="sim-sticker" aria-hidden="true"><strong id="sim-sticker-name"></strong><span id="sim-sticker-mix"></span><b id="sim-sticker-str"></b><span id="sim-sticker-date"></span></div>
</div>
<ol class="sim-steps"><li class="sim-step"><span>1</span>Open</li><li class="sim-step"><span>2</span>Draw</li><li class="sim-step"><span>3</span>Add</li><li class="sim-step"><span>4</span>Swirl</li><li class="sim-step"><span>5</span>Check</li><li class="sim-step"><span>6</span>Label</li></ol>
<div class="sim-caption" aria-live="polite"><h2 id="sim-caption-title">Ready when you are</h2><p id="sim-caption"></p></div>
<div class="lx-actions sim-actions"><button class="lx-btn running-outline" id="sim-play" type="button"><span>Play</span></button><button class="lx-btn lx-btn-outline" id="sim-reset" type="button">Start over</button></div>
<div class="sim-results"><p class="sim-picked">Your vial: <strong id="sim-picked"></strong></p><div class="lx-facts">
<div class="sim-result"><span>Strength</span><strong id="sim-strength">Press Play</strong></div>
<div class="sim-result"><span>In each syringe unit (0.01 mL)</span><strong id="sim-unit">—</strong></div>
<div class="sim-result"><span>Whole vial</span><strong id="sim-total">—</strong></div></div>
<div class="lx-actions"><a class="lx-btn lx-btn-outline" href="/calculator/" id="sim-calc">Open the calculator</a><a class="lx-btn lx-btn-outline" id="sim-protocol" hidden></a><span class="protocol-status" id="sim-protocol-status" hidden></span></div></div>
</section>
  </main>
